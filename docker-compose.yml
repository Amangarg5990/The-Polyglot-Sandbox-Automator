version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: containers/api/Dockerfile
    image: api:${GIT_SHA:-latest}
    container_name: devops-api-service
    ports:
      - "3000:3000"
    volumes:
      # Mount host docker socket to allow Docker-out-of-Docker (DooD) commands
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the temporary sandbox directory between host and API container
      - /tmp/sandbox:/tmp/sandbox
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - RUNNER_TAG=${GIT_SHA:-latest}
      - SANDBOX_DIR=/tmp/sandbox
      - HOST_SANDBOX_DIR=/tmp/sandbox
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: devops-redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

volumes:
  redis-data:
